name: Terraform Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      aws-region:
        description: "AWS region for provider and backend"
        required: true
        default: "us-east-1"
      terraform-workspace:
        description: "Terraform workspace to target (creates if missing)"
        required: true
        default: "dev"
      var-file:
        description: "Optional -var-file path relative to repo root"
        required: false
        default: ""
      auto-apply:
        description: "Apply the planned changes automatically"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ github.event.inputs.aws-region }}

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init -input=false

      - name: Select or create workspace
        env:
          TF_WORKSPACE: ${{ github.event.inputs.terraform-workspace }}
        run: |
          if terraform workspace list | grep -q "^  ${TF_WORKSPACE}$"; then
            terraform workspace select "${TF_WORKSPACE}"
          else
            terraform workspace new "${TF_WORKSPACE}"
          fi

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        env:
          TF_VAR_FILE: ${{ github.event.inputs.var-file }}
        run: |
          VAR_FILE_ARG=""
          if [ -n "$TF_VAR_FILE" ]; then
            VAR_FILE_ARG="-var-file=${TF_VAR_FILE}"
          fi
          terraform plan -input=false -out=tfplan $VAR_FILE_ARG
          terraform show -no-color tfplan > plan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.event.inputs.terraform-workspace }}
          path: |
            tfplan
            plan.txt
          retention-days: 5

  apply:
    name: Terraform apply
    needs: plan
    runs-on: ubuntu-latest
    if: github.event.inputs.auto-apply == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ github.event.inputs.aws-region }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.event.inputs.terraform-workspace }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Select workspace
        env:
          TF_WORKSPACE: ${{ github.event.inputs.terraform-workspace }}
        run: terraform workspace select "${TF_WORKSPACE}"

      - name: Terraform apply
        run: terraform apply -input=false tfplan
